name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

# Native Builds pro OS mit Tests, Linux zusätzlich als AppImage.
#
# Jeder Job hängt seine Pakete DIREKT ans Release, statt sie über
# upload-artifact/download-artifact zu reichen. Grund: der Umweg zählt voll auf
# die kontoweite Artefakt-Quota, und die war beim ersten Release-Versuch (v0.3.0)
# von einem anderen Repo belegt — "Artifact storage quota has been hit", der
# Windows-Build war fertig und scheiterte trotzdem beim Hochladen. Ohne den
# Umweg gibt es nichts, was volllaufen kann, und ~150 MB werden nicht zweimal
# durchs Netz bewegt.
#
# Die Jobs laufen deshalb nacheinander: zwei parallele Jobs, die dasselbe
# Release anlegen wollen, wären ein Rennen um dessen Erstellung.
jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # MinVer braucht die Historie inkl. Tags

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
          cache: true
          cache-dependency-path: Directory.Packages.props

      - name: Version ermitteln
        id: ver
        shell: bash
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            echo "v=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "v=0.0.0-dev.${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
          fi

      - name: Test
        run: dotnet test Parkett.Tests/Parkett.Tests.csproj -c Release

      - name: Publish (win-x64)
        run: >
          dotnet publish Parkett/Parkett.csproj
          -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true
          -p:Version=${{ steps.ver.outputs.v }}
          -o publish/win-x64

      - name: ZIP packen
        shell: pwsh
        run: Compress-Archive -Path publish/win-x64/* -DestinationPath "Parkett-${{ steps.ver.outputs.v }}-win-x64.zip"

      - name: Ans Release anhängen
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v3
        with:
          files: Parkett-*-win-x64.zip
          generate_release_notes: true
          fail_on_unmatched_files: true

  build-linux:
    needs: build-windows
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
          cache: true
          cache-dependency-path: Directory.Packages.props

      - name: Version ermitteln
        id: ver
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            echo "v=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "v=0.0.0-dev.${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
          fi

      - name: Test
        run: dotnet test Parkett.Tests/Parkett.Tests.csproj -c Release

      - name: Publish (linux-x64)
        run: >
          dotnet publish Parkett/Parkett.csproj
          -c Release -r linux-x64 --self-contained true
          -p:PublishSingleFile=true
          -p:Version=${{ steps.ver.outputs.v }}
          -o publish/linux-x64

      - name: Tarball packen
        run: tar -czf "Parkett-${{ steps.ver.outputs.v }}-linux-x64.tar.gz" -C publish/linux-x64 .

      - name: AppImage bauen
        run: bash packaging/linux/build-appimage.sh "${{ steps.ver.outputs.v }}" publish/linux-x64

      - name: Ans Release anhängen
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v3
        with:
          files: |
            Parkett-*-linux-x64.tar.gz
            Parkett-*-x86_64.AppImage
          generate_release_notes: true
          fail_on_unmatched_files: true
